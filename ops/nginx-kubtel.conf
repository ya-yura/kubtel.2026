server {
    listen 80;
    listen [::]:80;
    server_name <canonical-domain> <alternate-domain>;

    # Keep this block only if the certificate provider uses HTTP-01.
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://<canonical-domain>$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name <canonical-domain>;

    ssl_certificate /etc/letsencrypt/live/<canonical-domain>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<canonical-domain>/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 30s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name <alternate-domain>;

    ssl_certificate /etc/letsencrypt/live/<canonical-domain>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<canonical-domain>/privkey.pem;

    return 301 https://<canonical-domain>$request_uri;
}
