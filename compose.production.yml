services:
  kubtel:
    image: ${KUBTEL_IMAGE:?KUBTEL_IMAGE must be set}
    container_name: kubtel-site
    restart: unless-stopped
    init: true
    env_file:
      - ${KUBTEL_ENV_FILE:-/etc/kubtel-site.env}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4321
      LEAD_OUTBOX_DIR: /var/lib/kubtel-site/lead-outbox
    ports:
      - "127.0.0.1:4321:4321"
    volumes:
      - kubtel_lead_outbox:/var/lib/kubtel-site/lead-outbox
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4321/api/health.json').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5

volumes:
  kubtel_lead_outbox:
