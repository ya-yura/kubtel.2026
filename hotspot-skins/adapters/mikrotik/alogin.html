<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="robots" content="noindex,nofollow" />
    <meta http-equiv="refresh" content="3; url=$(link-orig)" />
    <title>Guest Wi-Fi | Connected</title>
    <link rel="stylesheet" href="portal.css" />
  </head>
  <body>
    <main class="cp-page">
      <div class="cp-shell">
        <header class="cp-topbar">
          <div class="cp-brand">
            <img class="cp-brand-logo" src="logo-wordmark.svg" alt="Кубтел" />
            <div class="cp-brand-text">
              <strong class="cp-venue">Гостевой Wi-Fi</strong>
              <span class="cp-network">$(hostname)</span>
            </div>
          </div>
        </header>

        <section class="cp-card" aria-labelledby="alogin-title">
          <div class="cp-main">
            <span class="cp-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="m10.1 15.1-3.3-3.3-1.7 1.7 5 5L20.2 8.4l-1.7-1.7-8.4 8.4Z" /></svg>
            </span>
            <div class="cp-copy">
              <h1 class="cp-title" id="alogin-title">Интернет подключен</h1>
              <p class="cp-lead">Через несколько секунд вы будете перенаправлены на запрошенный сайт.</p>
            </div>
            <div class="cp-actions">
              <a class="cp-button cp-button-primary" href="$(link-orig)">Продолжить</a>
              <a class="cp-button cp-button-ghost" href="$(link-status)">Статус подключения</a>
            </div>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
