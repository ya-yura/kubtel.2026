<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Kubtel Guest Wi-Fi | Ошибка</title>
    <link rel="stylesheet" href="../core/portal.css" />
  </head>
  <body>
    <main class="cp-page" id="main-content">
      <div class="cp-shell">
        <header class="cp-topbar">
          <div class="cp-brand">
            <img class="cp-brand-logo" src="../assets/logo-wordmark.svg" alt="Кубтел" />
            <div class="cp-brand-text">
              <strong class="cp-venue">Гостевой Wi-Fi</strong>
              <span class="cp-network">Cafe / Hotel / Office</span>
            </div>
          </div>
          <button class="cp-lang" type="button" data-language-toggle>ENG</button>
        </header>

        <section class="cp-card" aria-labelledby="error-title">
          <div class="cp-main">
            <div class="cp-alert" data-tone="error">
              <strong data-ru="Не удалось подключить" data-en="Could not connect"
                >Не удалось подключить</strong
              >
              <span
                data-ru="Код неверный, истек срок ожидания или сервис временно недоступен."
                data-en="The code is incorrect, expired or the service is temporarily unavailable."
              >
                Код неверный, истек срок ожидания или сервис временно недоступен.
              </span>
            </div>
            <div class="cp-copy">
              <h1
                class="cp-title"
                id="error-title"
                data-ru="Попробуйте еще раз"
                data-en="Try again"
              >
                Попробуйте еще раз
              </h1>
              <p
                class="cp-lead"
                data-ru="Проверьте номер телефона и код. Если ошибка повторяется, обратитесь в поддержку."
                data-en="Check your phone number and code. If the issue repeats, contact support."
              >
                Проверьте номер телефона и код. Если ошибка повторяется, обратитесь в поддержку.
              </p>
            </div>
            <div class="cp-actions">
              <a
                class="cp-button cp-button-primary"
                href="login.html"
                data-ru="Вернуться ко входу"
                data-en="Back to login"
                >Вернуться ко входу</a
              >
              <a
                class="cp-button cp-button-ghost"
                href="tel:+78002221730"
                data-ru="Позвонить в поддержку"
                data-en="Call support"
                >Позвонить в поддержку</a
              >
            </div>
          </div>
        </section>
      </div>
    </main>
    <script src="../core/portal.js"></script>
  </body>
</html>
