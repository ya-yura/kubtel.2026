<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Kubtel Guest Wi-Fi | Выход</title>
    <link rel="stylesheet" href="../core/portal.css" />
  </head>
  <body>
    <main class="cp-page" id="main-content">
      <div class="cp-shell">
        <header class="cp-topbar">
          <div class="cp-brand">
            <img class="cp-brand-logo" src="../assets/logo-wordmark.svg" alt="Кубтел" />
            <div class="cp-brand-text">
              <strong class="cp-venue">Гостевой Wi-Fi</strong>
              <span class="cp-network">Cafe / Hotel / Office</span>
            </div>
          </div>
          <button class="cp-lang" type="button" data-language-toggle>ENG</button>
        </header>

        <section class="cp-card" aria-labelledby="logout-title">
          <div class="cp-main">
            <div class="cp-copy">
              <h1
                class="cp-title"
                id="logout-title"
                data-ru="Сессия завершена"
                data-en="Session ended"
              >
                Сессия завершена
              </h1>
              <p
                class="cp-lead"
                data-ru="Доступ к гостевой сети отключен. При необходимости можно пройти авторизацию повторно."
                data-en="Guest access has been disconnected. You can sign in again if needed."
              >
                Доступ к гостевой сети отключен. При необходимости можно пройти авторизацию
                повторно.
              </p>
            </div>
            <div class="cp-actions single">
              <a
                class="cp-button cp-button-primary"
                href="login.html"
                data-ru="Подключиться снова"
                data-en="Connect again"
                >Подключиться снова</a
              >
            </div>
          </div>
        </section>
      </div>
    </main>
    <script src="../core/portal.js"></script>
  </body>
</html>
