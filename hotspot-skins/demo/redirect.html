<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="robots" content="noindex,nofollow" />
    <meta http-equiv="refresh" content="5; url=status.html" />
    <title>Kubtel Guest Wi-Fi | Ожидание</title>
    <link rel="stylesheet" href="../core/portal.css" />
  </head>
  <body>
    <main class="cp-page" id="main-content">
      <div class="cp-shell">
        <header class="cp-topbar">
          <div class="cp-brand">
            <img class="cp-brand-logo" src="../assets/logo-wordmark.svg" alt="Кубтел" />
            <div class="cp-brand-text">
              <strong class="cp-venue">Гостевой Wi-Fi</strong>
              <span class="cp-network">Cafe / Hotel / Office</span>
            </div>
          </div>
          <button class="cp-lang" type="button" data-language-toggle>ENG</button>
        </header>

        <section class="cp-card" aria-labelledby="redirect-title">
          <div class="cp-main">
            <div class="cp-copy">
              <h1
                class="cp-title"
                id="redirect-title"
                data-ru="Завершаем подключение"
                data-en="Finishing connection"
              >
                Завершаем подключение
              </h1>
              <p
                class="cp-lead"
                data-ru="Обычно это занимает несколько секунд. Если переход не произошел автоматически, нажмите кнопку."
                data-en="This usually takes a few seconds. If nothing happens automatically, press the button."
              >
                Обычно это занимает несколько секунд. Если переход не произошел автоматически,
                нажмите кнопку.
              </p>
            </div>
            <div class="cp-actions single">
              <a
                class="cp-button cp-button-primary"
                href="status.html"
                data-ru="Проверить подключение"
                data-en="Check connection"
                >Проверить подключение</a
              >
            </div>
          </div>
        </section>
      </div>
    </main>
    <script src="../core/portal.js"></script>
  </body>
</html>
