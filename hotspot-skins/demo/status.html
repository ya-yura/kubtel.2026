<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Kubtel Guest Wi-Fi | Подключено</title>
    <link rel="stylesheet" href="../core/portal.css" />
  </head>
  <body>
    <main class="cp-page" id="main-content">
      <div class="cp-shell">
        <header class="cp-topbar" aria-label="Портал гостевого Wi-Fi">
          <div class="cp-brand">
            <img class="cp-brand-logo" src="../assets/logo-wordmark.svg" alt="Кубтел" />
            <div class="cp-brand-text">
              <strong class="cp-venue">Гостевой Wi-Fi</strong>
              <span class="cp-network">Cafe / Hotel / Office</span>
            </div>
          </div>
          <button class="cp-lang" type="button" data-language-toggle>ENG</button>
        </header>

        <section class="cp-card" aria-labelledby="status-title">
          <div class="cp-main">
            <span class="cp-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="m10.1 15.1-3.3-3.3-1.7 1.7 5 5L20.2 8.4l-1.7-1.7-8.4 8.4Z" />
              </svg>
            </span>
            <div class="cp-copy">
              <h1
                class="cp-title"
                id="status-title"
                data-ru="Интернет подключен"
                data-en="Internet is connected"
              >
                Интернет подключен
              </h1>
              <p
                class="cp-lead"
                data-ru="Идентификация завершена. Можно закрыть эту страницу или перейти на нужный сайт."
                data-en="Identification is complete. You can close this page or continue browsing."
              >
                Идентификация завершена. Можно закрыть эту страницу или перейти на нужный сайт.
              </p>
            </div>

            <div class="cp-status-grid" aria-label="Статус подключения">
              <div class="cp-status-row">
                <span data-ru="Устройство" data-en="Device">Устройство</span>
                <strong>demo-client</strong>
              </div>
              <div class="cp-status-row">
                <span data-ru="IP-адрес" data-en="IP address">IP-адрес</span>
                <strong>192.0.2.10</strong>
              </div>
              <div class="cp-status-row">
                <span data-ru="Сессия" data-en="Session">Сессия</span>
                <strong data-ru="до 24 часов" data-en="up to 24 hours">до 24 часов</strong>
              </div>
            </div>

            <div class="cp-actions">
              <a
                class="cp-button cp-button-primary"
                href="https://kubtel.ru/"
                data-ru="Продолжить"
                data-en="Continue"
                >Продолжить</a
              >
              <a
                class="cp-button cp-button-ghost"
                href="logout.html"
                data-ru="Отключиться"
                data-en="Log out"
                >Отключиться</a
              >
            </div>
          </div>
        </section>
      </div>
    </main>
    <script src="../core/portal.js"></script>
  </body>
</html>
